image:
  repository: ghcr.io/peddavid/donarium
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Public URL of the UI (OIDC redirect, Origin checks, links in alerts).
publicUrl: https://donations.example.com

oidc:
  issuer: ""            # e.g. https://auth.example.com/application/o/donarium/
  clientId: donarium
  # Secret holding the client secret (leave empty for public clients).
  clientSecret:
    existingSecret: ""
    key: client-secret
  scopes: "profile email groups"
  adminClaim: groups
  adminValue: donarium-admins
  sessionTtl: 8h
  # Require a login no older than this to record a donation, e.g. 15m. Empty = off.
  stepUpMaxAge: ""

# Key encrypting session cookies. Generated once and kept across upgrades
# unless an existing Secret (with key `cookie-key`, >= 64 bytes) is given.
cookieKey:
  existingSecret: ""

# The SQLite database lives on this volume: sources, projects and, later,
# donations. Back it up; the donations cannot be rebuilt.
persistence:
  enabled: true
  # Use a claim you manage instead of creating one.
  existingClaim: ""
  storageClass: ""
  size: 1Gi
  # Keep the claim (and the data) when the release is uninstalled.
  keepOnUninstall: true

# Image scans: GitLab sources are read through the GitLab API.
gitlab:
  url: https://gitlab.com
  # Secret holding a read_api access token, for private repositories. Public
  # repositories need none. The token is only ever sent to `url`.
  tokenSecret:
    existingSecret: ""
    key: token

# A self-hosted Gitea or Forgejo that sources can live on. Without a url, Gitea
# sources cannot be added. This is the only place the host is set: a source can
# never name another one, so the token cannot be sent elsewhere.
gitea:
  url: ""              # e.g. https://git.example.com
  tokenSecret:
    existingSecret: ""   # a read:repository token, for private repositories
    key: token

# Receipts are found in a Paperless-ngx server and only linked, never copied.
# Without a url the receipt feature is off. The token is sent only to this url.
paperless:
  url: ""              # e.g. https://paperless.example.com
  tokenSecret:
    existingSecret: ""   # an API token; required when a url is set
    key: token

# Receipts that exist nowhere else can be uploaded to an S3-compatible bucket.
# Without an endpoint, uploads are off. Files are served to logged-in users
# through five-minute presigned links.
s3:
  endpoint: ""         # e.g. https://s3.eu-west-1.amazonaws.com
  region: us-east-1
  bucket: ""
  sse: false           # ask the storage to encrypt uploads (AES256)
  credentialsSecret:
    existingSecret: ""   # needs the two keys below
    accessKeyKey: access-key
    secretKeyKey: secret-key

# GitHub sources. A token is only needed for private repositories, and gives a
# higher rate limit (anonymous requests are limited to 60 an hour).
github:
  tokenSecret:
    existingSecret: ""
    key: token

# The currency totals are kept in (a three-letter code). It is fixed for a
# database the first time it is used: changing it later is refused.
baseCurrency: EUR

# Exchange rates for donations in other currencies, from a Frankfurter server
# (the European Central Bank's daily rates). With fx.disabled, such donations
# wait until a rate is entered by hand.
fx:
  url: https://api.frankfurter.dev
  disabled: false

# How often all sources are scanned. "0s" turns scheduled scans off (they can
# still be started from the UI).
scanInterval: 24h

# Registries to read image labels from besides the built-in public ones
# (Docker Hub, ghcr.io, quay.io, ...). Anonymous access only.
registryAllow: []

# Development only: every visitor is an admin.
insecureDevAuth: false

service:
  # Applies to the UI only. Metrics and health checks always get a separate
  # ClusterIP Service (<fullname>-metrics).
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: donations.example.com
  tls: []

serviceMonitor:
  enabled: false
  interval: 60s
  labels: {}

# Numeric IDs are required: with runAsNonRoot the kubelet cannot verify a
# non-numeric image USER. 65532 is distroless's `nonroot`.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Makes the volume writable for the non-root user.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

logJson: true
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
