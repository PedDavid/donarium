apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "donarium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "donarium.labels" . | nindent 4 }}
spec:
  # One replica: SQLite on a ReadWriteOnce volume, and one scheduler for scans.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "donarium.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "donarium.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "donarium.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: donarium
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DONARIUM_PUBLIC_URL
              value: {{ required "publicUrl is required" .Values.publicUrl | quote }}
            - name: DONARIUM_DATABASE_URL
              value: sqlite:///data/donarium.db
            - name: DONARIUM_GITLAB_URL
              value: {{ .Values.gitlab.url | quote }}
            {{- if .Values.gitlab.tokenSecret.existingSecret }}
            - name: DONARIUM_GITLAB_TOKEN_FILE
              value: /etc/donarium/gitlab/{{ .Values.gitlab.tokenSecret.key }}
            {{- end }}
            {{- if .Values.gitea.url }}
            - name: DONARIUM_GITEA_URL
              value: {{ .Values.gitea.url | quote }}
            {{- if .Values.gitea.tokenSecret.existingSecret }}
            - name: DONARIUM_GITEA_TOKEN_FILE
              value: /etc/donarium/gitea/{{ .Values.gitea.tokenSecret.key }}
            {{- end }}
            {{- end }}
            {{- if and .Values.paperless.url .Values.paperless.tokenSecret.existingSecret }}
            - name: DONARIUM_PAPERLESS_URL
              value: {{ .Values.paperless.url | quote }}
            - name: DONARIUM_PAPERLESS_TOKEN_FILE
              value: /etc/donarium/paperless/{{ .Values.paperless.tokenSecret.key }}
            {{- end }}
            {{- if and .Values.s3.endpoint .Values.s3.bucket .Values.s3.credentialsSecret.existingSecret }}
            - name: DONARIUM_S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: DONARIUM_S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: DONARIUM_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: DONARIUM_S3_ACCESS_KEY_FILE
              value: /etc/donarium/s3/{{ .Values.s3.credentialsSecret.accessKeyKey }}
            - name: DONARIUM_S3_SECRET_KEY_FILE
              value: /etc/donarium/s3/{{ .Values.s3.credentialsSecret.secretKeyKey }}
            {{- if .Values.s3.sse }}
            - name: DONARIUM_S3_SSE
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.registryCredentials.existingSecret }}
            - name: DONARIUM_REGISTRY_CREDENTIALS_FILE
              value: /etc/donarium/registry/{{ .Values.registryCredentials.key }}
            {{- end }}
            {{- if .Values.github.tokenSecret.existingSecret }}
            - name: DONARIUM_GITHUB_TOKEN_FILE
              value: /etc/donarium/github/{{ .Values.github.tokenSecret.key }}
            {{- end }}
            - name: DONARIUM_BASE_CURRENCY
              value: {{ .Values.baseCurrency | quote }}
            - name: DONARIUM_FX_URL
              value: {{ .Values.fx.url | quote }}
            {{- if .Values.fx.disabled }}
            - name: DONARIUM_FX_DISABLED
              value: "true"
            {{- end }}
            - name: DONARIUM_SCAN_INTERVAL
              value: {{ .Values.scanInterval | quote }}
            {{- with .Values.registryAllow }}
            - name: DONARIUM_REGISTRY_ALLOW
              value: {{ join "," . | quote }}
            {{- end }}
            - name: DONARIUM_COOKIE_KEY_FILE
              value: /etc/donarium/cookie/cookie-key
            {{- if .Values.insecureDevAuth }}
            - name: DONARIUM_INSECURE_DEV_AUTH
              value: "true"
            {{- else }}
            - name: DONARIUM_OIDC_ISSUER
              value: {{ required "oidc.issuer is required (or set insecureDevAuth for development)" .Values.oidc.issuer | quote }}
            - name: DONARIUM_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            {{- if .Values.oidc.clientSecret.existingSecret }}
            - name: DONARIUM_OIDC_CLIENT_SECRET_FILE
              value: /etc/donarium/oidc/{{ .Values.oidc.clientSecret.key }}
            {{- end }}
            - name: DONARIUM_OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: DONARIUM_ADMIN_CLAIM
              value: {{ .Values.oidc.adminClaim | quote }}
            - name: DONARIUM_ADMIN_VALUE
              value: {{ .Values.oidc.adminValue | quote }}
            - name: DONARIUM_SESSION_TTL
              value: {{ .Values.oidc.sessionTtl | quote }}
            {{- with .Values.oidc.stepUpMaxAge }}
            - name: DONARIUM_STEP_UP_MAX_AGE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.logJson }}
            - name: DONARIUM_LOG_JSON
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.gitlab.tokenSecret.existingSecret }}
            - name: gitlab-token
              mountPath: /etc/donarium/gitlab
              readOnly: true
            {{- end }}
            {{- if and .Values.s3.endpoint .Values.s3.bucket .Values.s3.credentialsSecret.existingSecret }}
            - name: s3-credentials
              mountPath: /etc/donarium/s3
              readOnly: true
            {{- end }}
            {{- if and .Values.paperless.url .Values.paperless.tokenSecret.existingSecret }}
            - name: paperless-token
              mountPath: /etc/donarium/paperless
              readOnly: true
            {{- end }}
            {{- if .Values.registryCredentials.existingSecret }}
            - name: registry-credentials
              mountPath: /etc/donarium/registry
              readOnly: true
            {{- end }}
            {{- if and .Values.gitea.url .Values.gitea.tokenSecret.existingSecret }}
            - name: gitea-token
              mountPath: /etc/donarium/gitea
              readOnly: true
            {{- end }}
            {{- if .Values.github.tokenSecret.existingSecret }}
            - name: github-token
              mountPath: /etc/donarium/github
              readOnly: true
            {{- end }}
            - name: cookie-key
              mountPath: /etc/donarium/cookie
              readOnly: true
            {{- if and (not .Values.insecureDevAuth) .Values.oidc.clientSecret.existingSecret }}
            - name: oidc
              mountPath: /etc/donarium/oidc
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "donarium.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.gitlab.tokenSecret.existingSecret }}
        - name: gitlab-token
          secret:
            secretName: {{ .Values.gitlab.tokenSecret.existingSecret }}
        {{- end }}
        {{- if and .Values.s3.endpoint .Values.s3.bucket .Values.s3.credentialsSecret.existingSecret }}
        - name: s3-credentials
          secret:
            secretName: {{ .Values.s3.credentialsSecret.existingSecret }}
        {{- end }}
        {{- if and .Values.paperless.url .Values.paperless.tokenSecret.existingSecret }}
        - name: paperless-token
          secret:
            secretName: {{ .Values.paperless.tokenSecret.existingSecret }}
        {{- end }}
        {{- if .Values.registryCredentials.existingSecret }}
        - name: registry-credentials
          secret:
            secretName: {{ .Values.registryCredentials.existingSecret }}
        {{- end }}
        {{- if and .Values.gitea.url .Values.gitea.tokenSecret.existingSecret }}
        - name: gitea-token
          secret:
            secretName: {{ .Values.gitea.tokenSecret.existingSecret }}
        {{- end }}
        {{- if .Values.github.tokenSecret.existingSecret }}
        - name: github-token
          secret:
            secretName: {{ .Values.github.tokenSecret.existingSecret }}
        {{- end }}
        - name: cookie-key
          secret:
            secretName: {{ include "donarium.cookieSecretName" . }}
        {{- if and (not .Values.insecureDevAuth) .Values.oidc.clientSecret.existingSecret }}
        - name: oidc
          secret:
            secretName: {{ .Values.oidc.clientSecret.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
