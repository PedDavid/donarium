[package]
name = "donarium"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.37", features = ["serde"] }
mime_guess = "2.0.5"
openidconnect = { version = "4", default-features = false }
prometheus-client = "0.25"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie-private", "form"] }
askama = "0.16"
time = "0.3"

[dev-dependencies]
chrono = "0.4"
http-body-util = "0.1.5"
rand08 = { package = "rand", version = "0.8" }
rsa = "0.9"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
