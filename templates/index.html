{% extends "base.html" %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Projects</h1>
      <p class="text-muted-foreground text-sm">The open-source projects you depend on.</p>
    </div>
  </div>

  <form id="filters" class="flex flex-col gap-3" hx-get="/" hx-target="#projects-table" hx-push-url="true"
        hx-trigger="input changed delay:250ms from:#q, change">
    <div class="relative grow sm:max-w-xs">
      <span class="pointer-events-none absolute start-2.5 top-1/2 -translate-y-1/2 text-muted-foreground [&>svg]:size-4">{% include "icons/search.svg" %}</span>
      <input id="q" class="input ps-8" type="search" name="q" value="{{ filters.q }}" placeholder="Filter by name or repository…" aria-label="Filter">
    </div>
  </form>

  <div id="projects-table">
    {% include "partials/projects_table.html" %}
  </div>
</div>
{% endblock %}
